<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test de los 4 Elementos</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI','Calibri',system-serif,sans-serif;background:#EEF1F5;color:#1A1A2E;font-size:15px;min-height:100vh}
.topbar{background:#0D1B2A;display:flex;align-items:stretch}
.tb-accent{width:5px;background:#C4973B;flex-shrink:0}
.tb-text{padding:14px 20px}
.tb-text h1{font-size:15px;font-weight:700;color:#fff;letter-spacing:.4px;text-transform:uppercase}
.tb-text p{font-size:11px;color:#8A9BB0;margin-top:2px}
.app{max-width:680px;margin:0 auto;padding:24px 16px 60px}
.step-bar{display:flex;align-items:center;margin-bottom:24px;gap:0}
.sb-item{display:flex;align-items:center;gap:6px;flex:1}
.sb-num{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;border:2px solid #D0D8E4;color:#B0BCC8;background:#fff;flex-shrink:0;transition:all .3s}
.sb-num.done{background:#0D1B2A;border-color:#0D1B2A;color:#fff}
.sb-num.act{background:#C4973B;border-color:#C4973B;color:#fff}
.sb-lbl{font-size:11px;color:#B0BCC8;font-weight:600;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}
.sb-lbl.act,.sb-lbl.done{color:#0D1B2A}
.sb-line{flex:1;height:2px;background:#D0D8E4;margin:0 8px}
.sb-line.done{background:#0D1B2A}
.panel{display:none}.panel.act{display:block;animation:fadeUp .3s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card{background:#fff;border:1px solid #D8DFE8;border-radius:4px;padding:20px 22px;margin-bottom:14px}
.card-accent{border-top:3px solid #0D1B2A}
.sec-label{font-size:10px;font-weight:700;color:#6B7A8D;text-transform:uppercase;letter-spacing:.8px;margin-bottom:4px}
.sec-title{font-size:22px;font-weight:700;color:#0D1B2A;margin-bottom:6px;line-height:1.2}
.sec-sub{font-size:14px;color:#6B7A8D;line-height:1.65;margin-bottom:0}
.inp{border:1px solid #D0D8E4;border-radius:3px;padding:9px 12px;font-size:14px;font-family:inherit;background:#FAFBFC;color:#1A1A2E;width:100%}
.inp:focus{outline:none;border-color:#0D1B2A;background:#fff}
.btn{border:1px solid #D0D8E4;border-radius:3px;padding:10px 20px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;text-transform:uppercase;letter-spacing:.5px;transition:all .15s}
.btn-primary{background:#0D1B2A;color:#fff;border-color:#0D1B2A}
.btn-primary:hover{background:#1A3248}
.btn-ghost{background:#fff;color:#6B7A8D;border-color:#D0D8E4}
.btn-ghost:hover{border-color:#0D1B2A;color:#0D1B2A}
.btn-gold{background:#C4973B;color:#fff;border-color:#C4973B}
.btn-gold:hover{background:#B08530}
/* TEST */
.test-cols{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
.col-head{text-align:center;padding:8px 4px;border-radius:3px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px}
.col-head-neutral{background:#F4F6F8;color:#6B7A8D}



.renglon-wrap{margin-bottom:10px}
.renglon-num{font-size:10px;color:#B0BCC8;font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px;text-align:center}
.renglon{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.opcion{background:#F8F9FB;border:1.5px solid #E2E8F0;border-radius:3px;padding:10px 6px;text-align:center;cursor:pointer;transition:all .18s;font-size:13px;color:#6B7A8D;user-select:none;position:relative;font-weight:500;line-height:1.3}
.opcion:hover{border-color:#0D1B2A;color:#0D1B2A;background:#fff}
.opcion.pos{border-color:#2E6B8A;background:#EAF3F8;color:#1A4F6B;font-weight:600}
.opcion.neg{border-color:#8A3A2E;background:#F8EDEA;color:#6B2820;font-weight:600}
.opcion.pos::after{content:"+1";position:absolute;top:3px;right:4px;font-size:9px;font-weight:700;color:#2E6B8A}
.opcion.neg::after{content:"−1";position:absolute;top:3px;right:4px;font-size:9px;font-weight:700;color:#8A3A2E}
.prog-wrap{margin-bottom:16px}
.prog-label{font-size:12px;color:#6B7A8D;margin-bottom:5px}
.prog-track{height:5px;background:#E2E8F0;border-radius:3px;overflow:hidden}
.prog-fill{height:100%;background:linear-gradient(90deg,#0D1B2A,#C4973B);border-radius:3px;transition:width .3s}
.score-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px;padding-top:14px;border-top:1px solid #E2E8F0}
.score-box{text-align:center;padding:10px 4px;border-radius:3px;border:1px solid #E2E8F0;background:#F8F9FB}
.score-val{font-size:22px;font-weight:700;display:block;line-height:1}
.score-lbl{font-size:9px;font-weight:700;color:#B0BCC8;text-transform:uppercase;letter-spacing:.6px;display:block;margin-top:4px}
/* RESULTADO */
.elem-hero{border-radius:4px;padding:26px 22px;margin-bottom:14px;border:2px solid;text-align:center}
.elem-symbol{font-size:42px;margin-bottom:10px;display:block;font-family:'Calibri',serif;line-height:1}
.elem-name{font-size:28px;font-weight:700;margin-bottom:6px}
.elem-frase{font-size:15px;font-style:italic;color:#3A4A5C;margin-top:8px;line-height:1.65}
.map-row{display:flex;gap:10px;margin-bottom:10px}
.map-badge{flex:1;text-align:center;padding:12px 8px;border-radius:3px;border:1px solid}
.map-badge-lbl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;display:block;margin-bottom:5px}
.map-badge-val{font-size:15px;font-weight:700;display:block}
.char-list{list-style:none;padding:0}
.char-list li{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px solid #F0F2F5;font-size:13px;color:#3A4A5C;line-height:1.55}
.char-list li:last-child{border-bottom:none}
.char-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;margin-top:5px}
.prop-block{padding:12px 14px;border-radius:3px;margin-bottom:10px;border-left:3px solid}
.prop-lbl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;margin-bottom:5px}
.prop-txt{font-size:13px;color:#3A4A5C;line-height:1.65}
/* DESCARGA */
.download-box{background:#0D1B2A;border-radius:4px;padding:20px 22px;text-align:center;margin-bottom:14px}
.dl-label{font-size:10px;font-weight:700;color:#C4973B;text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px}
.dl-code{font-family:monospace;font-size:18px;font-weight:700;color:#fff;letter-spacing:4px;background:#1A3248;padding:10px 20px;border-radius:3px;display:inline-block;margin-bottom:12px}
.dl-text{font-size:12px;color:#8A9BB0;margin-bottom:14px;line-height:1.6}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:18px;padding-top:14px;border-top:1px solid #E2E8F0;gap:10px}
.note-box{background:#F5EFE3;border-left:3px solid #C4973B;border-radius:0 3px 3px 0;padding:12px 14px;margin-bottom:14px;font-size:13px;color:#3A4A5C;line-height:1.6}
</style>
</head>
<body>

  <div class="tb-accent"></div>

// ─── ESTADO ─────────────────────────────────────────────────
var S = {nombre:"", cargo:"", empresa:"", respuestas:{}, resultado:null};
var PASO = 0;
var STEPS = ["Presentación","El test","Mis resultados"];

// ─── UTILS ──────────────────────────────────────────────────
function ge(id){return document.getElementById(id);}
function mk(tag,cls,txt){var d=document.createElement(tag);if(cls)d.className=cls;if(txt!==undefined)d.textContent=txt;return d;}

function calcScore(){
  var sc={agua:0,fuego:0,tierra:0,aire:0};
  Object.keys(S.respuestas).forEach(function(k){
    var p=k.split("-"), elem=ECOLS[parseInt(p[1])];
    sc[elem]+=S.respuestas[k];
  });
  return sc;
}
function renglonOK(r){
  var pos=0,neg=0;
  for(var c=0;c<4;c++){var v=S.respuestas[r+"-"+c];if(v===1)pos++;if(v===-1)neg++;}
  return pos===1&&neg===1;
}
function countOK(){var n=0;for(var r=0;r<10;r++)if(renglonOK(r))n++;return n;}

function calcResultado(sc){
  var orden=["agua","fuego","tierra","aire"].sort(function(a,b){return sc[b]-sc[a];});
  var negs=["agua","fuego","tierra","aire"].sort(function(a,b){return sc[a]-sc[b];});
  return {scores:sc, principal:orden[0], complemento:orden[1], opuesto:negs[0]};
}

// ─── STEP BAR ────────────────────────────────────────────────
function renderStepBar(){
  var bar=ge("step-bar");bar.innerHTML="";
  STEPS.forEach(function(lbl,i){
    if(i>0){
      var ln=mk("div","sb-line"+(i<=PASO?" done":""));
      bar.appendChild(ln);
    }
    var item=mk("div","sb-item");
    var num=mk("div","sb-num"+(i===PASO?" act":i<PASO?" done":""),i<PASO?"✓":String(i+1));
    var ltxt=mk("span","sb-lbl"+(i<=PASO?" act":""),lbl);
    item.appendChild(num);item.appendChild(ltxt);
    bar.appendChild(item);
  });
}

function irA(i){
  PASO=i;renderStepBar();
  document.querySelectorAll(".panel").forEach(function(p,j){p.classList.toggle("act",j===i);});
  window.scrollTo({top:0,behavior:"smooth"});
}

// ─── PANEL 0: PRESENTACIÓN ──────────────────────────────────
function buildPresentacion(){
  var p=ge("p0");p.innerHTML="";

  var intro=mk("div","card card-accent");
  var lbl=mk("div","sec-label","Herramienta de autoconocimiento");
  var tit=mk("div","sec-title","Test de los 4 Elementos");
  var sub=mk("div","sec-sub","Identifica tu elemento preponderante y comprende cómo impacta tu forma natural de ser, trabajar y relacionarte.");
  intro.appendChild(lbl);intro.appendChild(tit);intro.appendChild(sub);
  p.appendChild(intro);

  var nota=mk("div","note-box");
  nota.innerHTML="<strong>Importante:</strong> Esta herramienta es un facilitador de autoconocimiento. Los cuatro elementos son marcos de reflexión — ninguno es mejor ni peor. Lo que importa es la conciencia que construyes a partir de este resultado.";
  p.appendChild(nota);

  var como=mk("div","card");
  var cl=mk("div","sec-label","Cómo funciona");
  var ct=mk("div");ct.style.fontSize="13px";ct.style.color="#3A4A5C";ct.style.lineHeight="1.7";
  ct.innerHTML="Vas a responder <strong>10 renglones</strong>, cada uno con 4 palabras. En cada renglon debes:<br><br>— Hacer clic <strong>una vez</strong> en la palabra con la que <strong>más</strong> te identificas (+1)<br>— Hacer clic <strong>dos veces</strong> en la palabra con la que <strong>menos</strong> te identificas (−1)<br>— Un tercer clic borra la selección<br><br>Cada renglon debe tener exactamente <strong>un +1 y un −1</strong>.";
  como.appendChild(cl);como.appendChild(ct);
  p.appendChild(como);

  var form=mk("div","card");
  form.appendChild(mk("div","sec-label","Tus datos"));

  var fg1=mk("div");fg1.style.marginBottom="10px";
  var l1=mk("label");l1.style.cssText="font-size:11px;font-weight:700;color:#6B7A8D;text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:5px";l1.textContent="Nombre completo *";
  var inp1=document.createElement("input");inp1.className="inp";inp1.id="inNom";inp1.placeholder="Tu nombre completo";
  fg1.appendChild(l1);fg1.appendChild(inp1);form.appendChild(fg1);

  var g2=mk("div");g2.style.cssText="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:0";

  var fg2=mk("div");
  var l2=mk("label");l2.style.cssText="font-size:11px;font-weight:700;color:#6B7A8D;text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:5px";l2.textContent="Cargo";
  var inp2=document.createElement("input");inp2.className="inp";inp2.id="inCargo";inp2.placeholder="Tu cargo";
  fg2.appendChild(l2);fg2.appendChild(inp2);

  var fg3=mk("div");
  var l3=mk("label");l3.style.cssText="font-size:11px;font-weight:700;color:#6B7A8D;text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:5px";l3.textContent="Área / Equipo";
  var inp3=document.createElement("input");inp3.className="inp";inp3.id="inArea";inp3.placeholder="Tu área o equipo";
  fg3.appendChild(l3);fg3.appendChild(inp3);

  g2.appendChild(fg2);g2.appendChild(fg3);form.appendChild(g2);
  p.appendChild(form);

  var nav=mk("div","nav");nav.style.justifyContent="flex-end";
  var btn=mk("button","btn btn-primary","Comenzar el test →");
  btn.onclick=function(){
    var nom=(ge("inNom").value||"").trim();
    if(!nom){alert("Por favor ingresa tu nombre para continuar.");ge("inNom").focus();return;}
    S.nombre=nom;
    S.cargo=(ge("inCargo").value||"").trim();
    S.empresa=(ge("inArea").value||"").trim();
    buildTest();irA(1);
  };
  nav.appendChild(btn);p.appendChild(nav);
}

// ─── PANEL 1: TEST ──────────────────────────────────────────
function buildTest(){
  var p=ge("p1");p.innerHTML="";

  var hdr=mk("div","card card-accent");
  hdr.appendChild(mk("div","sec-label","10 renglones · 2 selecciones por renglon"));
  hdr.appendChild(mk("div","sec-title","El test"));
  var sub=mk("div","sec-sub","Marca +1 en la palabra que MÁS te identifica y −1 en la que MENOS te identifica. Un renglon incompleto no cuenta.");
  hdr.appendChild(sub);p.appendChild(hdr);

  // Progreso
  var pw=mk("div","prog-wrap");
  var pl=mk("div","prog-label","0 de 10 renglones completados");pl.id="prog-lbl";
  var pt=mk("div","prog-track");var pf=mk("div","prog-fill");pf.id="prog-fill";pf.style.width="0%";
  pt.appendChild(pf);pw.appendChild(pl);pw.appendChild(pt);p.appendChild(pw);

  // Headers columnas
  var head=mk("div","test-cols");
  ["agua","fuego","tierra","aire"].forEach(function(e){
    var letras=["A","B","C","D"];head.appendChild(mk("div","col-head col-head-neutral","Columna "+letras[ECOLS.indexOf(e)]));
  });
  p.appendChild(head);

  // Renglones
  RENGLONES.forEach(function(ren,r){
    var wrap=mk("div","renglon-wrap");
    wrap.appendChild(mk("div","renglon-num","Renglon "+(r+1)));
    var row=mk("div","renglon");
    for(var c=0;c<4;c++){
      var key=r+"-"+c;
      var op=mk("div","opcion",ren[c]);
      op.setAttribute("data-key",key);
      var cur=S.respuestas[key];
      if(cur===1)op.className="opcion pos";
      else if(cur===-1)op.className="opcion neg";
      op.onclick=(function(k,rn){return function(){
        var cur2=S.respuestas[k]||0;
        if(cur2===0){
          var posN=0;for(var cc=0;cc<4;cc++)if(S.respuestas[rn+"-"+cc]===1)posN++;
          if(posN>=1){S.respuestas[k]=-1;this.className="opcion neg";}
          else{S.respuestas[k]=1;this.className="opcion pos";}
        } else if(cur2===1){
          var negN=0;for(var cc2=0;cc2<4;cc2++)if(S.respuestas[rn+"-"+cc2]===-1)negN++;
          if(negN>=1){S.respuestas[k]=0;this.className="opcion";}
          else{S.respuestas[k]=-1;this.className="opcion neg";}
        } else {S.respuestas[k]=0;this.className="opcion";}
        updateProg();
      };})(key,r);
      row.appendChild(op);
    }
    wrap.appendChild(row);p.appendChild(wrap);
  });

  // Score en vivo
  var sc=calcScore();
  var sr=mk("div","score-row");
  ECOLS.forEach(function(e){
    var sb=mk("div","score-box");
    sb.style.borderColor=ECOLOR[e];
    var sv=mk("div");sv.id="scv-"+e;sv.className="score-val";sv.style.color=ECOLOR[e];sv.textContent=String(sc[e]||0);
    sb.appendChild(sv);var letras2=["A","B","C","D"];sb.appendChild(mk("span","score-lbl","Col. "+letras2[ECOLS.indexOf(e)]));
    sr.appendChild(sb);
  });
  p.appendChild(sr);

  var nav=mk("div","nav");
  var back=mk("button","btn btn-ghost","← Anterior");back.onclick=function(){irA(0);};
  var calc=mk("button","btn btn-primary","Ver mis resultados →");
  calc.onclick=function(){
    if(countOK()<10){alert("Completa todos los renglones antes de continuar. Te faltan "+(10-countOK())+".");return;}
    var scores=calcScore();
    if(scores.agua+scores.fuego+scores.tierra+scores.aire!==0){alert("La suma de todos los puntajes debe ser 0. Revisa tus respuestas.");return;}
    S.resultado=calcResultado(scores);
    buildResultado();irA(2);
  };
  nav.appendChild(back);nav.appendChild(calc);p.appendChild(nav);
}

function updateProg(){
  var n=countOK();
  var lbl=ge("prog-lbl");var fill=ge("prog-fill");
  if(lbl)lbl.textContent=n+" de 10 renglones completados";
  if(fill)fill.style.width=(n*10)+"%";
  var sc=calcScore();
  ECOLS.forEach(function(e){var v=ge("scv-"+e);if(v)v.textContent=String(sc[e]);});
}

// ─── PANEL 2: RESULTADO ─────────────────────────────────────
function buildResultado(){
  var p=ge("p2");p.innerHTML="";
  var res=S.resultado;var perf=PERFILES[res.principal];
  var ec=ECOLOR[res.principal],eb=EBGCOLOR[res.principal];

  // Encabezado
  var hdr=mk("div","card card-accent");
  hdr.appendChild(mk("div","sec-label","Tu resultado"));
  hdr.appendChild(mk("div","sec-title","Tu mapa elemental, "+S.nombre));
  p.appendChild(hdr);

  // Hero del elemento
  var hero=mk("div","elem-hero");
  hero.style.cssText="border-radius:4px;padding:28px 22px;margin-bottom:14px;border:2px solid "+ec+";background:"+eb+";text-align:center";
  var sym=mk("div");sym.style.cssText="font-size:48px;margin-bottom:10px;display:block;color:"+ec+";font-weight:700";sym.textContent=SIMBOLOS[res.principal];
  var ename=mk("div");ename.style.cssText="font-size:26px;font-weight:700;color:"+ec+";margin-bottom:8px";ename.textContent="Elemento "+ENOMBRES[res.principal];
  var efrase=mk("div");efrase.style.cssText="font-size:15px;font-style:italic;color:#3A4A5C;line-height:1.65";efrase.textContent=perf.frase;
  var eesen=mk("div");eesen.style.cssText="font-size:13px;color:#3A4A5C;margin-top:12px;line-height:1.65;text-align:left";eesen.textContent=perf.esencia;
  hero.appendChild(sym);hero.appendChild(ename);hero.appendChild(efrase);hero.appendChild(eesen);
  p.appendChild(hero);

  // Puntajes
  var csc=mk("div","card");
  csc.appendChild(mk("div","sec-label","Tus puntajes"));
  var sr=mk("div","score-row");sr.style.marginTop="8px";sr.style.paddingTop="0";sr.style.borderTop="none";
  ECOLS.forEach(function(e){
    var sb=mk("div","score-box");sb.style.borderColor=ECOLOR[e];sb.style.background=EBGCOLOR[e];
    var sv=mk("span","score-val");sv.style.color=ECOLOR[e];sv.textContent=(res.scores[e]>0?"+":"")+res.scores[e];
    sb.appendChild(sv);var letras2=["A","B","C","D"];sb.appendChild(mk("span","score-lbl","Col. "+letras2[ECOLS.indexOf(e)]));
    sr.appendChild(sb);
  });
  csc.appendChild(sr);p.appendChild(csc);

  // Mapa relacional (complemento + opuesto)
  var mrow=mk("div","map-row");
  [{tipo:"Complemento",e:res.complemento,nota:"Se potencian mutuamente."},{tipo:"Opuesto",e:res.opuesto,nota:"Tu maestro en el trabajo."}].forEach(function(item){
    var mb=mk("div","map-badge");mb.style.borderColor=ECOLOR[item.e];mb.style.background=EBGCOLOR[item.e];
    var ml=mk("span","map-badge-lbl");ml.style.color=ECOLOR[item.e];ml.textContent=item.tipo;
    var mv=mk("span","map-badge-val");mv.style.color=ECOLOR[item.e];mv.textContent=SIMBOLOS[item.e]+" "+ENOMBRES[item.e];
    var mn=mk("div");mn.style.cssText="font-size:11px;color:#6B7A8D;margin-top:4px";mn.textContent=item.nota;
    mb.appendChild(ml);mb.appendChild(mv);mb.appendChild(mn);mrow.appendChild(mb);
  });
  p.appendChild(mrow);

  // Fortalezas
  var cfor=mk("div","card");
  cfor.appendChild(mk("div","sec-label","Tus fortalezas naturales"));
  var ul=mk("ul","char-list");
  perf.fortalezas.forEach(function(f){
    var li=document.createElement("li");
    var dot=mk("div","char-dot");dot.style.background=ec;
    li.appendChild(dot);li.appendChild(document.createTextNode(f));
    ul.appendChild(li);
  });
  cfor.appendChild(ul);p.appendChild(cfor);

  // Sombras
  var csom=mk("div","card");
  csom.appendChild(mk("div","sec-label","Áreas de crecimiento"));
  var ul2=mk("ul","char-list");
  perf.sombras.forEach(function(s){
    var li=document.createElement("li");
    var dot=mk("div","char-dot");dot.style.background="#8A3A2E";
    li.appendChild(dot);li.appendChild(document.createTextNode(s));
    ul2.appendChild(li);
  });
  csom.appendChild(ul2);p.appendChild(csom);

  // Bloques trabajo / propósito / crecimiento / opuesto
  [{lbl:"En el trabajo",txt:perf.trabajo},{lbl:"Tu relación con el propósito",txt:perf.proposito},{lbl:"Tu reto de crecimiento",txt:perf.crecimiento},{lbl:"La lección de tu opuesto — Elemento "+ENOMBRES[res.opuesto],txt:perf.opuestoLeccion}].forEach(function(item){
    var bl=mk("div","prop-block");bl.style.borderLeftColor=ec;bl.style.background=eb+"80";
    var pl=mk("div","prop-lbl");pl.style.color=ec;pl.textContent=item.lbl;
    bl.appendChild(pl);bl.appendChild(mk("div","prop-txt",item.txt));
    p.appendChild(bl);
  });

  // Caja de descarga — código + botón JSON
  var dlbox=mk("div","download-box");
  var dlcode=generarCodigo();
  dlbox.appendChild(mk("div","dl-label","Tu código de resultado"));
  var dlc=mk("div","dl-code",dlcode);dlbox.appendChild(dlc);
  var dlt=mk("div","dl-text","Comparte este código con tu facilitador o descarga tu ficha de resultados para que sea incluida en el análisis grupal del equipo.");
  dlbox.appendChild(dlt);
  var dlbtn=mk("button","btn btn-gold","Descargar mi ficha de resultados");
  dlbtn.style.marginRight="8px";
  dlbtn.onclick=function(){descargarFicha();};
  dlbox.appendChild(dlbtn);
  p.appendChild(dlbox);

  // Cierre motivacional
  var cierre=mk("div","card");
  var ct=mk("div");ct.style.cssText="font-size:14px;color:#3A4A5C;line-height:1.75;text-align:center;font-style:italic";
  ct.innerHTML="<strong style='color:"+ec+"'>Eres Elemento "+ENOMBRES[res.principal]+".</strong> No como una etiqueta — como un punto de partida.<br>Lo que haces con esta conciencia es lo que separa al elemento que reacciona del elemento que elige.";
  cierre.appendChild(ct);p.appendChild(cierre);

  var nav=mk("div","nav");
  var back=mk("button","btn btn-ghost","← Revisar test");back.onclick=function(){irA(1);};
  nav.appendChild(back);p.appendChild(nav);
}

// ─── CÓDIGO Y DESCARGA ───────────────────────────────────────
function generarCodigo(){
  var r=S.resultado;
  return [
    S.nombre.split(" ")[0].toUpperCase().slice(0,4),
    r.principal.slice(0,2).toUpperCase(),
    Math.abs(r.scores.agua)+Math.abs(r.scores.fuego)+Math.abs(r.scores.tierra)+Math.abs(r.scores.aire),
    new Date().getDate()+""+(new Date().getMonth()+1)
  ].join("-");
}

function descargarFicha(){
  var r=S.resultado;
  var ficha={
    nombre: S.nombre,
    cargo: S.cargo,
    area: S.empresa,
    fecha: new Date().toLocaleDateString("es-CO",{year:"numeric",month:"long",day:"numeric"}),
    agua: r.scores.agua,
    fuego: r.scores.fuego,
    tierra: r.scores.tierra,
    aire: r.scores.aire,
    principal: r.principal,
    complemento: r.complemento,
    opuesto: r.opuesto,
    codigo: generarCodigo()
  };
  var blob=new Blob([JSON.stringify(ficha,null,2)],{type:"application/json"});
  var url=URL.createObjectURL(blob);
  var a=document.createElement("a");
  a.href=url;
  a.download="4elem_"+S.nombre.replace(/\s+/g,"_")+"_"+ficha.principal+".json";
  document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
}

// ─── INIT ────────────────────────────────────────────────────
function init(){
  var panels=ge("panels");panels.innerHTML="";
  STEPS.forEach(function(_,i){
    var pn=mk("div","panel");pn.id="p"+i;panels.appendChild(pn);
  });
  renderStepBar();
  buildPresentacion();
  irA(0);
}

init();
</script>
